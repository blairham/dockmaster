# The stage the README screenshots are taken on (make screenshots): a small
# shop of public images, so the pictures show a realistic daemon and
# nothing from the developer's own.
name: shop
services:
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 3s
      retries: 3
  api:
    image: traefik/whoami:v1.10
    ports: ["8081:80"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
  cache:
    image: redis:7-alpine
  worker:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i + 1))
          echo "$$(date -u +%H:%M:%S) INF processed order id=$$((1000 + i)) items=$$((i % 5 + 1)) total=$$((i * 7 % 300)).00"
          [ $$((i % 9)) -eq 0 ] && echo "$$(date -u +%H:%M:%S) WRN payment retry order=$$((1000 + i)) attempt=2"
          sleep 1
        done
