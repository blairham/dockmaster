[[IgnoredVulns]]
id = "GO-2026-5932"
# golang.org/x/crypto/openpgp is deprecated, and this advisory covers every
# x/crypto version with no fixed release. dockmaster does not require x/crypto:
# it is only in the module graph (go.sum's /go.mod lines), and no package in the
# build imports it (`go list -deps -test ./...`). The changie tool module that
# once pulled it into the build is gone; drop this entry once Scorecard's
# Vulnerabilities check is seen to stay clean without it.
reason = "x/crypto/openpgp is not imported by any package in the build; the advisory flags all x/crypto versions"
