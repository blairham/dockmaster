# Pre-commit configuration for dockmaster
# Install: pre-commit install
# Run:     pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^dist/
      - id: end-of-file-fixer
        exclude: ^dist/
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # Go housekeeping
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # golangci-lint via the upstream hooks (no local scripts). `golangci-lint-fmt`
  # runs the formatters configured in .golangci.yml (gofumpt, gci, golines);
  # `golangci-lint` lints what changed since HEAD. This is the repo's only lint
  # surface — there is no `make lint`, and CI runs these same hooks. Keep `rev`
  # in lockstep with go.mod's tool pin.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint

  # Personal hooks: keep go.mod's Go version and .tool-versions' golang pin from
  # drifting, and catch committed conflict markers. `check-conflict-markers`
  # replaces upstream's `check-merge-conflict`, which knows only git's three
  # default markers (so a diff3 `|||||||` line slips through) and does not scan
  # at all outside an in-progress merge.
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.4.0
    hooks:
      # Every .go file carries the two-line SPDX header; a file without one
      # has no stated license once it is copied out of the repo.
      - id: check-license-headers
        args: [--license, Apache-2.0]
      - id: check-go-version-sync
      - id: check-conflict-markers
      # Known-vulnerable dependencies fail the commit, not the release.
      - id: go-vulncheck

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: ^dist/

  # YAML style (sequence indentation etc.; config in .yamllint.yml)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yml']
