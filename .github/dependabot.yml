# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # The Charm stack (bubbletea, lipgloss, bubbles) moves together.
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]
      # The Docker SDK and the moby modules it is split across.
      docker:
        patterns: ["github.com/docker/*", "github.com/moby/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
