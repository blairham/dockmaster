name: Release

# A signed v* tag releases through blairham/.github's go-release.yml:
# GoReleaser builds the darwin/linux archives and the `dockmaster` formula (with
# the `dm` symlink) in blairham/homebrew-tap, cosign signs checksums.txt
# keylessly, and every archive gets SLSA build provenance, attached as
# dockmaster-<tag>.intoto.jsonl. The notes are the tag's CHANGELOG.md
# section. The signing identity is go-release.yml itself; SECURITY.md shows
# how to verify it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestation both sign with the
      # workflow's OIDC identity — see signs in .goreleaser.yaml.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      # -short, as in CI: the live-daemon tests read whatever the runner's
      # daemon holds, which is not a fixture.
      test-command: go test -race -short ./...
    secrets:
      # A fine-grained token with contents:write on blairham/homebrew-tap
      # only; GITHUB_TOKEN cannot push to another repository.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
