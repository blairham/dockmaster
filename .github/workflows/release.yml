name: Release

# A release is release-please's: merging its release pull request tags vX.Y.Z
# and calls this workflow (release-please.yml), which releases through
# blairham/.github's go-release.yml: GoReleaser builds the darwin/linux
# archives and the `dockmaster` formula (with the `dm` symlink) in
# blairham/homebrew-tap, cosign signs checksums.txt keylessly, and every
# archive gets SLSA build provenance, attached as dockmaster-<tag>.intoto.jsonl.
# The notes are the tag's CHANGELOG.md section, which release-please wrote. The
# signing identity is go-release.yml itself; SECURITY.md shows how to verify it.
#
# Pushing a tag by hand releases nothing: there is one path to a release. Run
# it by hand (workflow_dispatch) only to redo a release from a tag that exists,
# or for a dry run.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # The version is release-please's answer, not a number someone typed: the
  # tag must be the version its manifest records at that tag, so a release can
  # only be the bump its commits call for (docs/versioning.md). A dry run
  # builds whatever it is given and skips this.
  version:
    name: Version is release-please's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.dry-run != true
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: The tag is the version release-please recorded
        if: inputs.dry-run != true
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="v$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::the tag is $TAG but .release-please-manifest.json at it records $want; release by merging release-please's pull request"
            exit 1
          fi

  release:
    name: Release
    needs: version
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestation both sign with the
      # workflow's OIDC identity — see signs in .goreleaser.yaml.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      # -short, as in CI: the live-daemon tests read whatever the runner's
      # daemon holds, which is not a fixture.
      test-command: go test -race -short ./...
    secrets:
      # A fine-grained token with contents:write on blairham/homebrew-tap
      # only; GITHUB_TOKEN cannot push to another repository.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
