name: CI

# Everything that gates a merge. The shared jobs — Pre-commit, Detect changed
# files, Build and test, Fuzz — are blairham/.github's go-ci.yml, shared with
# every Go repository there; their checks report as `CI / <job>`. The
# cross-compile matrix is dockmaster's own and stays below, `needs: ci`, with
# its steps gated on `needs.ci.outputs.code == 'true'` (never a job-level
# `if:` or a `paths:` filter: a required check that never runs is pending
# forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '53 5 * * 3'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      # -short skips the live-daemon tests. The runner has a docker daemon, but
      # what is on it is GitHub's business, not a fixture; the suite that
      # matters drives the TUI headlessly and needs no daemon at all.
      test-command: go test -race -short ./...

  # Releases ship darwin and linux binaries, and the engine code is split by
  # build tag (host_darwin.go, host_other.go). A file that compiles only on the
  # runner's OS would otherwise surface at release time, after the tag.
  cross:
    name: Cross-compile
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go build and vet for ${{ matrix.goos }}/${{ matrix.goarch }}
        if: needs.ci.outputs.code == 'true'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
