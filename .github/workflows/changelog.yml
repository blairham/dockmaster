name: Changelog

# Every pull request records its change for the changelog — one changie file
# under .changes/unreleased/ — or says it has none with the `no-changelog`
# label (CI, docs, refactors nobody using dockmaster can see). The kind in that
# file is what decides the next version (docs/versioning.md), so a change with
# no file is a change the version never hears about.
#
# Its own workflow, not a job in ci.yml: adding or removing the label has to
# re-run this check, and should not re-run the whole of CI.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit, to see what the pull request added
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/changie/go.mod
          check-latest: true
          cache-dependency-path: tools/changie/go.sum

      # Every pending file must parse and name a kind the config knows;
      # otherwise the release that batches it is where it fails.
      - name: Pending changes are valid
        run: |
          set -euo pipefail
          # Right after a release nothing is pending, and changie's auto bump
          # refuses an empty set rather than answering "no release".
          if ! compgen -G '.changes/unreleased/*.yaml' >/dev/null; then
            echo "::notice::no changes pending since $(go tool -modfile=tools/changie/go.mod changie latest)"
            exit 0
          fi
          next="$(go tool -modfile=tools/changie/go.mod changie next auto)"
          go tool -modfile=tools/changie/go.mod changie batch auto --dry-run >/dev/null
          echo "::notice::the pending changes make the next release $next"

      # CHANGELOG.md is generated: what is committed must be what changie
      # builds from .changes/, or a hand edit is lost at the next release.
      - name: CHANGELOG.md is what changie generates
        run: |
          set -euo pipefail
          if ! go tool -modfile=tools/changie/go.mod changie merge --dry-run | diff -u CHANGELOG.md -; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md differs from what changie generates; edit .changes/, not CHANGELOG.md, then run 'go tool -modfile=tools/changie/go.mod changie merge'"
            exit 1
          fi

      - name: The pull request records its change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          # A release pull request batches the pending files into a version
          # file; that counts as recording the change.
          added="$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '.changes/unreleased/*.yaml' '.changes/v*.md')"
          if [ -n "$added" ]; then
            printf 'recorded:\n%s\n' "$added"
            exit 0
          fi
          if [ "$NO_CHANGELOG" = true ]; then
            echo "::notice::no changelog entry: labeled no-changelog"
            exit 0
          fi
          echo "::error::no change recorded: run 'make change' and commit the file it writes under .changes/unreleased/, or label the pull request no-changelog if nobody using dockmaster can see it"
          exit 1
